# ============================================================
# daily-webdav-backup 配置文件
#
# 使用方式：
#   1. 复制为 config/config.yml
#   2. 修改 webdav、notify、encryption 和 jobs
#   3. 重启容器：
#        docker compose restart
#
# 说明：
#   - config/config.yml 包含 WebDAV 密码，不要提交到 Git
#   - 所有顶层配置都可以被同名大写环境变量覆盖，见 README
#   - 路径都是“容器内路径”，宿主机目录先在 docker-compose.yml 挂载
# ============================================================

# ------------------------------------------------------------
# 1. 调度
#
# schedule：标准 5 段 cron，或 "HH:MM" 简写
#   "0 3 * * *"      每天 03:00
#   "30 2 * * 1"     每周一 02:30
#   "0 */6 * * *"    每 6 小时
#   "03:00"          等价于每天 03:00
#
# timezone：任务按这个时区计算；建议和 compose 的 TZ 保持一致
# ------------------------------------------------------------
schedule: "0 3 * * *"
timezone: "Asia/Shanghai"

# ------------------------------------------------------------
# 2. 自动发现（推荐）
#
# auto_discover=true 时，扫描 discover_root 下的一级子目录，
# 每个子目录自动生成一个任务：
#   /sources/etc      -> 任务 etc
#   /sources/appdata  -> 任务 appdata
#
# compose 里只需要：
#   volumes:
#     - /etc:/sources/etc:ro
#     - /opt/appdata:/sources/appdata:ro
#
# 开启后 jobs 可以省略。
# 如果写了同名的手动 job，手动 job 优先，可用来覆盖或禁用某个目录。
# ------------------------------------------------------------
auto_discover: false
discover_root: "/sources"

# ------------------------------------------------------------
# 3. WebDAV
#
# 使用 rclone 的 webdav backend。
# 地址、用户名、密码、远端路径都在这里配置；
# 程序启动时会自动生成 /data/.rclone.conf 并把密码 obscure。
#
# url：WebDAV 地址，通常以 / 结尾
#   Nextcloud：
#     https://cloud.example.com/remote.php/dav/files/用户名/
#   ownCloud：
#     https://cloud.example.com/remote.php/dav/files/用户名/
#   通用 WebDAV：
#     https://dav.example.com/dav/
#
# user / password：WebDAV 登录账号和明文密码
#   也可以写 ${WEBDAV_PASSWORD} 引用环境变量
#
# vendor：WebDAV 服务端类型
#   other           通用 WebDAV（默认）
#   nextcloud       Nextcloud
#   owncloud        ownCloud 10
#   infinitescale   ownCloud Infinite Scale
#   fastmail        Fastmail Files
#   sharepoint      SharePoint Online
#   sharepoint-ntlm SharePoint NTLM
#   rclone          rclone serve webdav
#
# remote_path：远端根路径，下面按任务名分子目录
#   任务 etc 最终上传到：
#     <remote_name>:<remote_path>/etc/
#
# remote_name：rclone remote 名，默认 webdav
# rclone_config：自动生成的 rclone 配置路径，默认 /data/.rclone.conf
# ------------------------------------------------------------
webdav:
  url: "https://dav.example.com/dav/"
  user: "backup"
  password: "change-me"
  vendor: "other"
  remote_path: "/backups/nas"
  # remote_name: "webdav"
  # rclone_config: "/data/.rclone.conf"

# ------------------------------------------------------------
# 4. 消息推送（MQTT 推送中心）
#
# enabled：是否启用推送
# api_url：推送接口地址
# server_name：来源服务器名称，会写入推送记录
# category：service（服务通知）/ todo（待办）
# topic：MQTT 主题
# mode：append（追加）/ overwrite（覆盖同 server_name+topic+title）
# on_success_mqtt：成功时是否推送到 MQTT
#   false = 只保存推送记录，不推手机
# on_failure_mqtt：失败/告警时是否推送到 MQTT
# timeout：HTTP 请求超时秒数
#
# 推送失败只写日志，不影响备份。
# ------------------------------------------------------------
notify:
  enabled: true
  api_url: "https://push-server.o1-1.xct258.top/api/push"
  server_name: "nas-backup"
  category: "service"
  topic: "backup/webdav"
  mode: "append"
  on_success_mqtt: false
  on_failure_mqtt: true
  timeout: 10

# ------------------------------------------------------------
# 5. 归档加密（可选）
#
# enabled：是否加密；加密发生在 tar 打包之后、上传之前
# method：
#   age  使用公钥加密，推荐
#   gpg  使用对称密码
#
# age：
#   生成密钥：
#     age-keygen -o age.key
#   把输出的 age1... 公钥填到 recipient
#   恢复时使用 age.key 私钥解密
#   上传文件扩展名：.tar.zst.age
#
# gpg：
#   passphrase_env 指定密码所在环境变量，默认 BACKUP_GPG_PASSPHRASE
#   也可以直接写 passphrase，但不推荐
#   上传文件扩展名：.tar.zst.gpg
#
# 注意：.sha256 校验的是加密后的文件。
# ------------------------------------------------------------
encryption:
  enabled: false
  method: "age"
  recipient: ""
  # passphrase: ""
  # passphrase_env: "BACKUP_GPG_PASSPHRASE"

# ------------------------------------------------------------
# 6. 默认参数
#
# 这里的值会被所有 job 继承；job 里可以单独覆盖。
#
# compression：压缩方式
#   zstd  推荐，速度快、体积小
#   gzip  兼容性好
#   none  不压缩（适合已经是压缩格式的数据）
#
# zstd_level：zstd 压缩等级 1-22
#   1 最快，3 默认，19 更小但更慢，22 最慢
#
# keep_last：远端每个任务保留最近 N 份
#   0 = 不按数量清理
#
# keep_days：远端按天数清理
#   0 = 不按天数清理
#   和 keep_last 同时生效：满足任一删除条件就删
#
# archive_root：归档内路径相对哪个根目录
#   默认 "/"：
#     /sources/etc 在归档里是 sources/etc
#   设为 "/sources"：
#     /sources/etc 在归档里是 etc
#
# xattrs：是否保留扩展属性（需要文件系统支持）
# one_file_system：是否只备份同一文件系统，不跨挂载点
#
# exclude：GNU tar 排除规则，路径相对于 archive_root
#   ** 表示任意层级
#   例如：
#     **/.cache/**
#     **/node_modules/**
#     **/*.tmp
# ------------------------------------------------------------
defaults:
  compression: "zstd"
  zstd_level: 3
  keep_last: 7
  keep_days: 0
  archive_root: "/"
  xattrs: false
  one_file_system: false
  exclude:
    - "**/.cache/**"
    - "**/node_modules/**"
    - "**/*.tmp"
    - "**/lost+found/**"

# ------------------------------------------------------------
# 7. 任务列表
#
# 每个 job 生成一个独立归档，上传到：
#   <remote_name>:<remote_path>/<job.name>/
#
# name：任务名
#   只能包含字母、数字、下划线、点、横线
#   同时作为远端子目录名和归档文件名前缀
#   name 不能重复
#
# enabled：是否启用
#   旧版本建议先用 false 测试，确认后改 true
#
# paths：要备份的容器内绝对路径
#   宿主机目录先在 compose 里挂载
#   路径不存在时任务失败，不会静默跳过
#
# archive_root：归档内路径根，覆盖 defaults
#
# remote_path：可选，覆盖该任务的远端目录
#
# compression / zstd_level / keep_last / keep_days /
# xattrs / one_file_system：覆盖 defaults
#
# exclude：追加到 defaults.exclude，不会替换
#
# pre_cmd：打包前执行自定义命令
# post_cmd：打包后执行，无论成功失败都会执行
#   hook 可用环境变量：
#     JOB_NAME / PHASE / ARCHIVE_PATH / HOOK_DIR
#   HOOK_DIR 是容器内部临时目录，适合放临时文件
#   所需命令必须已经装进镜像
#
# 示例：备份 /etc 和 /opt/appdata，归档内路径分别是
#   etc/...
#   appdata/...
# ------------------------------------------------------------
jobs:
  - name: "etc"
    enabled: true
    paths:
      - "/sources/etc"
    archive_root: "/sources"

  - name: "appdata"
    enabled: true
    paths:
      - "/sources/appdata"
      - "/sources/www"
    archive_root: "/sources"

    # 可选：单独指定远端目录
    # remote_path: "/backups/nas/appdata"

    # 可选：单独覆盖压缩和保留
    # compression: "zstd"
    # zstd_level: 3
    # keep_last: 14
    # keep_days: 0

    # 追加到 defaults.exclude
    exclude:
      - "**/cache/**"

    # 打包前执行
    pre_cmd: ""

    # 打包后执行
    post_cmd: ""
