# ============================================================
# 自动生成的占位配置
#
# 容器首次启动时如果找不到 config/config.yml，会复制本文件。
#
# 当前是安全占位状态：
#   - WebDAV 是假地址
#   - 推送关闭
#   - 自动发现关闭
#   - 任务禁用
#   - 加密关闭
#
# 修改完成后执行：
#   docker compose restart
#
# 注意：
#   - 这个文件包含 WebDAV 密码，不要提交到 Git
#   - 路径都是容器内路径，宿主机目录先在 docker-compose.yml 挂载
# ============================================================

# ------------------------------------------------------------
# 1. 调度
#
# schedule：标准 5 段 cron，或 "HH:MM" 简写
#   "0 3 * * *"      每天 03:00
#   "30 2 * * 1"     每周一 02:30
#   "0 */6 * * *"    每 6 小时
#   "03:00"          等价于每天 03:00
#
# timezone：影响 cron、日志时间和归档文件名
# ------------------------------------------------------------
schedule: "0 3 * * *"
timezone: "Asia/Shanghai"

# 服务器名称：推送和远端目录共用，只写一次
# remote_path 只需写基础路径，程序会自动追加 /<server_name>
server_name: "my-server"

# ------------------------------------------------------------
# 2. 自动发现（推荐开启）
#
# true 时扫描 discover_root 下的一级子目录，每个子目录一个任务：
#   /sources/etc      -> 任务 etc
#   /sources/appdata  -> 任务 appdata
#
# compose 挂载示例：
#   - /etc:/sources/etc:ro
#   - /opt/appdata:/sources/appdata:ro
#
# 开启后 jobs 可以省略；同名手动任务优先。
# ------------------------------------------------------------
auto_discover: false
discover_root: "/sources"

# ------------------------------------------------------------
# 3. WebDAV
#
# url：WebDAV 地址，通常以 / 结尾
#   OpenList / Alist：
#     https://openlist.example.com/dav/
#   Nextcloud：
#     https://cloud.example.com/remote.php/dav/files/用户名/
#   通用 WebDAV：
#     https://dav.example.com/dav/
#
# user / password：WebDAV 登录账号和明文密码
#   程序启动时会自动生成 /data/.rclone.conf 并 obscure 密码
#   也可以用 ${WEBDAV_PASSWORD} 引用环境变量
#
# vendor：WebDAV 服务端类型
#   other           通用 WebDAV（默认）
#   nextcloud       Nextcloud
#   owncloud        ownCloud 10
#   infinitescale   ownCloud Infinite Scale
#   fastmail        Fastmail Files
#   sharepoint      SharePoint Online
#   sharepoint-ntlm SharePoint NTLM
#   rclone          rclone serve webdav
#
# remote_path：远端基础路径，最终为 <remote_path>/<server_name>/<时间>/<任务>
# 已经以 server_name 结尾的旧路径不会重复追加
#
# 单路径：
#   remote_path: "/backups/nas"
#
# 多路径（每个路径独立间隔和保留）：
#   remote_path:
#     - path: "/backups/nas"
#       interval: "1d"
#       keep_last: 7
#       keep_days: 0
#     - path: "/backups/nas2"
#       interval: "7d"
#       keep_last: 4
#       keep_days: 0
#
# interval 支持：30m / 12h / 1d / 7d / 30d；
#   0 或 always 表示每次调度都上传。
#
# date_format：远端时间目录格式，默认按天
#   最终结构：<target.path>/<时间>/<job>/<归档>
#   例：backups/nas/2026-11-08/docker/docker-....tar.zst
#   空字符串或 "none" 表示不加时间目录
#
# remote_name：rclone remote 名，默认 webdav
# rclone_config：自动生成的 rclone 配置路径
# ------------------------------------------------------------
webdav:
  url: "https://example.invalid/dav/"
  user: "backup"
  password: "change-me"
  vendor: "other"
  # 整包上传被拒绝（如 413）时自动分段上传
  split_upload: "auto"
  split_size_mb: 90
  remote_path: "/backups/nas"
  # 多路径示例：把上面单行替换成列表
  # remote_path:
  #   - path: "/backups/nas"
  #     interval: "1d"
  #     keep_last: 7
  #     keep_days: 0
  #   - path: "/backups/nas2"
  #     interval: "7d"
  #     keep_last: 4
  #     keep_days: 0
  date_format: "%Y-%m-%d"
  # remote_name: "webdav"
  # rclone_config: "/data/.rclone.conf"

# ------------------------------------------------------------
# 4. 消息推送
#
# enabled：是否启用推送
# api_url：推送接口
# server_name：来源服务器名称，留空使用顶层 server_name
# category：service / todo
# topic：MQTT 主题
# mode：append / overwrite
# on_success_mqtt：成功时是否推送到 MQTT
#   false = 只保存记录，不推手机
# on_failure_mqtt：失败/告警时是否推送到 MQTT
# timeout：HTTP 超时秒数
#
# 占位配置默认关闭，避免误发。
# ------------------------------------------------------------
notify:
  enabled: false
  api_url: "https://push-server.o1-1.xct258.top/api/push"
  server_name: ""
  category: "service"
  topic: "backup/webdav"
  mode: "append"
  on_success_mqtt: false
  on_failure_mqtt: true
  timeout: 10

# ------------------------------------------------------------
# 5. 归档加密
#
# 默认使用 GPG 对称加密。
# 下面的 change-me 必须修改，否则所有归档都会用这个默认密码加密。
#
# method：
#   gpg  对称密码（默认）
#   age  公钥加密（可选）
#
# gpg：
#   passphrase：加密密码
#   passphrase_env：也可以从环境变量读取密码
#   上传扩展名：.tar.zst.gpg
#   使用 AES256-OCB（AEAD），解密需要 GnuPG >= 2.2.21
#
# age：
#   age-keygen -o age.key
#   把输出的 age1... 公钥填到 recipient
#   上传扩展名：.tar.zst.age
#
# .sha256 校验的是加密后的文件。
# ------------------------------------------------------------
encryption:
  enabled: true
  method: "gpg"
  passphrase: "change-me"
  # recipient: ""          # 仅 method=age 时使用
  # passphrase_env: "BACKUP_GPG_PASSPHRASE"

# ------------------------------------------------------------
# 6. 磁盘空间监控
#
# 默认只监控容器根文件系统 /
# 需要监控 /data、/sources/... 时在 paths 里单独添加。
#
# 首次不足推送一次；之后每 cooldown_minutes 仍不足再推送。
# 默认 360 分钟 = 6 小时。
# 多个路径属于同一个文件系统时会去重，只告警一次。
# ------------------------------------------------------------
monitor:
  enabled: true
  interval: "5m"
  min_free_gb: 10
  min_free_percent: 10
  cooldown_minutes: 360
  notify_recovery: true

  paths:
    - name: "root"
      path: "/"

    # 需要时再添加：
    # - name: "data"
    #   path: "/data"
    #   min_free_gb: 20

# ------------------------------------------------------------
# 7. 默认参数
#
# compression：
#   zstd / gzip / none
#
# zstd_level：1-22
#   1 最快，3 默认，19 更小但更慢
#
# keep_last：远端每个任务/目标保留最近 N 份
#   0 = 不按数量清理
#
# keep_days：远端按天数清理
#   0 = 不按天数清理
#   和 keep_last 同时生效
#
# archive_root：归档内路径相对哪个根目录
#   默认 "/"：/sources/etc -> sources/etc
#   设为 "/sources"：/sources/etc -> etc
#
# xattrs：是否保留扩展属性
# one_file_system：是否只备份同一文件系统
#
# exclude：GNU tar 排除规则，相对于 archive_root
# ------------------------------------------------------------
defaults:
  compression: "zstd"
  zstd_level: 3
  keep_last: 7
  keep_days: 0
  archive_root: "/"
  xattrs: false
  one_file_system: false
  # 默认不设置排除项，所有文件都会进入归档。
  # 需要排除时改成列表，例如：
  # exclude:
  #   - "**/.cache/**"
  #   - "**/node_modules/**"
  #   - "**/*.tmp"
  exclude: []

# ------------------------------------------------------------
# 8. 任务列表
#
# 每个 job 生成一个归档，上传到：
#   <target.path>/<时间>/<job.name>/<archive>
#
# name：任务名，同时作为远端子目录和文件名前缀
#   只能包含字母、数字、下划线、点、横线
#
# enabled：是否启用
# paths：容器内绝对路径
# archive_root：归档内路径根
# remote_path：可选，单目标模式下覆盖任务目录
#   webdav.remote_path 配置成多目标时不支持
#
# 以下字段可覆盖 defaults：
#   compression / zstd_level / keep_last / keep_days /
#   xattrs / one_file_system / exclude
#
# pre_cmd：打包前执行自定义命令
# post_cmd：打包后执行，无论成功失败
#   可用环境变量：
#     JOB_NAME / PHASE / ARCHIVE_PATH / HOOK_DIR
#
# 占位任务默认禁用。修改 enabled: true 和 paths 后才会真正备份。
# ------------------------------------------------------------
jobs:
  - name: "placeholder"
    enabled: false
    paths:
      - "/sources"
    archive_root: "/"
    # remote_path: "/backups/nas/placeholder"
    # compression: "zstd"
    # zstd_level: 3
    # keep_last: 7
    # keep_days: 0
    # exclude:
    #   - "**/cache/**"
    # pre_cmd: ""
    # post_cmd: ""
