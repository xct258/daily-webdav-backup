# ============================================================
# 自动生成的占位配置
#
# 容器首次启动时如果找不到 config/config.yml，会复制本文件。
# 修改完成后执行：
#   docker compose restart
#
# 这是占位配置：
#   - WebDAV 是假地址
#   - 任务默认禁用
#   - 推送默认关闭
# 修改好真实信息后再启用任务。
# ============================================================

# 调度：每天 03:00；也可以写 "03:00"
schedule: "0 3 * * *"
# 时区：影响 cron、日志和归档文件名
timezone: "Asia/Shanghai"

# 自动发现：true 时把 /sources 下每个一级子目录变成一个任务
# 挂载示例：
#   - /etc:/sources/etc:ro
#   - /opt/appdata:/sources/appdata:ro
auto_discover: false
discover_root: "/sources"

# WebDAV 连接信息
# url / user / password / remote_path 必须改成真实值
webdav:
  url: "https://example.invalid/dav/"
  user: "backup"
  password: "change-me"
  # vendor 常用值：other / nextcloud / owncloud / infinitescale / fastmail
  vendor: "other"
  # 远端根路径，下面按任务名分子目录
  remote_path: "/backups/nas"
  # 多路径示例：把上面单行替换成列表
  # remote_path:
  #   - path: "/backups/nas"
  #     interval: "1d"
  #     keep_last: 7
  #   - path: "/backups/nas2"
  #     interval: "7d"
  #     keep_last: 4
  # 时间目录格式；最终结构 <remote_path>/<job>/<时间>/<归档>
  # 空字符串或 "none" 表示不加时间目录
  date_format: "%Y-%m-%d"

# 消息推送
# enabled: false 时完全不推送
# on_success_mqtt: false 表示成功只保存记录，不推手机
notify:
  enabled: false
  api_url: "https://push-server.o1-1.xct258.top/api/push"
  server_name: "nas-backup"
  category: "service"
  topic: "backup/webdav"
  mode: "append"
  on_success_mqtt: false
  on_failure_mqtt: true

# 归档加密
# method: age / gpg
# age 需要 recipient 公钥；gpg 需要 passphrase 或 passphrase_env
encryption:
  enabled: false
  method: "age"
  recipient: ""

# 默认参数，可被每个 job 覆盖
defaults:
  # zstd / gzip / none
  compression: "zstd"
  # zstd 等级 1-22
  zstd_level: 3
  # 每个任务远端保留最近 N 份；0 = 不按数量清理
  keep_last: 7
  # 远端按天数清理；0 = 不按天数清理
  keep_days: 0
  # 归档内路径相对这个目录
  archive_root: "/"
  # GNU tar 排除规则，相对于 archive_root
  exclude:
    - "**/.cache/**"
    - "**/node_modules/**"
    - "**/*.tmp"

# 占位任务：默认禁用
# 修改 enabled: true 和 paths 后才会真正备份
jobs:
  - name: "placeholder"
    enabled: false
    paths:
      - "/sources"
    archive_root: "/"
