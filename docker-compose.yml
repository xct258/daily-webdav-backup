# ============================================================
# Docker Compose 部署配置
#
# 使用步骤：
#   1. 修改 install/app.conf 的 IMAGE_REPO，并同步修改下面的 image
#   2. 构建镜像：
#        bash scripts/build.sh
#      或使用 GitHub Actions 发布的生产镜像
#   3. 准备 config/config.yml（不存在时容器会自动生成占位配置）
#   4. 按需取消注释下面 volumes 里要备份的宿主机目录
#   5. docker compose up -d
#
# 修改 volumes 后必须重新创建容器：
#   docker compose up -d --force-recreate
# 只执行 docker compose restart 不会应用新的挂载。
# ============================================================

services:
  backup:
    # 镜像名必须与 install/app.conf 的 IMAGE_REPO:IMAGE_TAG 一致
    image: xct258/daily-webdav-backup:latest

    # 容器名，docker exec / docker logs 时使用
    container_name: daily-backup

    # 进程退出后自动拉起；docker stop 后不会自动拉起
    restart: unless-stopped

    # 使用 tini 回收 tar / rclone 产生的孤儿进程
    init: true

    # Docker 停止容器时最多等待的时间
    # 调度器内部会给 tar/rclone 45 秒收尾，再被 Docker 强制结束
    stop_grace_period: 90s

    # 本容器只需要主动访问 WebDAV，不需要 host 网络
    # 如果确实需要 host 网络，取消下面注释，并注释掉 ports（当前没有 ports）
    # network_mode: host

    # 配置路径固定为 /config/config.yml，日志固定写到 /data/logs，
    # Python 输出不缓冲由 startup/services.sh 设置，均不在 compose 中配置。
    volumes:
      # 配置目录。
      # - config/config.yml 不存在时，prepare.sh 会自动生成占位配置
      # - 自动生成要求该目录可写；如果希望只读，请先在宿主机创建好 config.yml
      # - config.yml 里有 WebDAV 密码，注意权限，不要提交到 Git
      - ./config:/config

      # 运行数据：state、logs、健康心跳。
      # 不包含 staging；staging 固定使用容器内部 /tmp/backup-staging。
      - ./data:/data

      # ------------------------------------------------------
      # 要备份的宿主机目录
      #
      # 推荐挂到 /sources/<名字>，并在 config.yml 里开启：
      #   auto_discover: true
      #   discover_root: "/sources"
      #
      # 这样每个一级子目录会自动变成一个任务：
      #   /sources/etc      -> 任务 etc
      #   /sources/appdata  -> 任务 appdata
      #
      # 源目录建议全部加 :ro，避免备份程序误修改数据。
      # ------------------------------------------------------
      # - /etc:/sources/etc:ro
      # - /opt/appdata:/sources/appdata:ro
      # - /var/www:/sources/www:ro
      # - /home/xct258/docker:/sources/docker:ro

      # 注意：
      # - 不要挂载 /tmp/backup-staging，它必须只存在于容器内部
      # - 不要把备份项目自己的 data/staging 挂载进来
      # - 如果宿主机目录包含备份项目自身，请自行决定是否排除其 data/密钥

    healthcheck:
      # 检查 /data/state/heartbeat 是否在 300 秒内更新
      # 只代表调度器进程活着，不代表备份成功
      test: ["CMD", "python3", "/opt/backup/main.py", "health"]
      # 每 5 分钟检查一次
      interval: 5m
      # 单次检查超过 10 秒算失败
      timeout: 10s
      # 连续失败 3 次才标记 unhealthy
      retries: 3
      # 启动后 2 分钟内的失败不计入重试次数
      start_period: 2m

    # 本容器不需要对外提供服务，所以没有 ports。
    # 如果以后增加 Web UI，再按需添加：
    # ports:
    #   - "8080:8080"
