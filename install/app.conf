#!/bin/bash
# ============================================================
# 构建配置
#   镜像名 / 标签 / 架构
#   运行依赖：tar + zstd + python3 + rclone
#   rclone 和 app/ 代码由 install/custom-install.sh 安装
# ============================================================

IMAGE_REPO=xct258/daily-webdav-backup
IMAGE_TAG=latest

PLATFORMS=linux/amd64,linux/arm64

# ------------------------------------------------------------
# 系统依赖
# ------------------------------------------------------------
APT_PACKAGES=(
  ca-certificates
  curl
  tzdata
  zstd
  tar
  gzip
  unzip
)

# ------------------------------------------------------------
# 快捷软件（本项目的 rclone 在 custom-install.sh 里装最新版）
# ------------------------------------------------------------
INSTALL_7Z=false

# ------------------------------------------------------------
# Python 依赖：配置解析 + cron 计算
# ------------------------------------------------------------
PYTHON_PACKAGES=(
  PyYAML
  croniter
)

# ------------------------------------------------------------
# 自定义安装：下载 rclone + app/ 代码
# ------------------------------------------------------------
INSTALL_CUSTOM=true

# ------------------------------------------------------------
# 模板日志模块（固定到提交 SHA）
# ------------------------------------------------------------
LOG_LIB_URL=https://raw.githubusercontent.com/xct258/common/3d48863b2ba5c1de4cfacaa77993e35c77d3d675/%E8%84%9A%E6%9C%AC%E5%B7%A5%E5%85%B7/shell/%E6%97%A5%E5%BF%97%E8%AE%B0%E5%BD%95%E5%92%8C%E6%8E%A8%E9%80%81/log.sh
